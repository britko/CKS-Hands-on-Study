apiVersion: v1
kind: Namespace
metadata:
  name: cks-runtime
---
apiVersion: v1
kind: Pod
metadata:
  name: suspicious
  namespace: cks-runtime
  labels:
    app: suspicious
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
        capabilities:
          add: ["NET_RAW"]
---
apiVersion: v1
kind: Pod
metadata:
  name: hardened
  namespace: cks-runtime
  labels:
    app: hardened
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: false
