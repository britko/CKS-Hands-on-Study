apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["configmaps", "pods"]
      - group: "apps"
        resources: ["deployments"]
  - level: Metadata
    omitStages:
      - RequestReceived
