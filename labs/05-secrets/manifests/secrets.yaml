apiVersion: v1
kind: Namespace
metadata:
  name: cks-secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cks-secrets
type: Opaque
stringData:
  username: cks-user
  password: change-me-in-real-systems
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: cks-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-one-secret
  namespace: cks-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: cks-secrets
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: cks-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-one-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: secure-app
  namespace: cks-secrets
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: app-secret
          mountPath: /etc/app-secret
          readOnly: true
  volumes:
    - name: app-secret
      secret:
        secretName: app-secret
