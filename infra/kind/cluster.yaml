kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cks
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.0
  - role: worker
    image: kindest/node:v1.34.0
