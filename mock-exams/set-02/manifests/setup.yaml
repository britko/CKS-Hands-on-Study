apiVersion: v1
kind: Namespace
metadata:
  name: exam-cilium
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-image
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-falco
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: exam-cilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=exam-api"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: exam-cilium
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: exam-cilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: risky
  namespace: exam-image
spec:
  containers:
    - name: nginx
      image: nginx:latest
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: secure
  namespace: exam-image
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: falco-target
  namespace: exam-falco
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
